name: Publish to GitHub Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}
  release:
      types: [published]
jobs:
  publish:
    # Runner de GitHub: publicar no necesita nada de la red de la oficina, y con
    # el self-hosted la publicacion quedaba en cola hasta encender esa maquina.
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # NODE 22, Y NO 20 POR NOSTALGIA. Con 20 el `jsdom` de las pruebas
          # revienta al cargar —`webidl.util.markAsUncloneable is not a
          # function`, de un `undici` que pide un Node más nuevo— y la
          # publicación se cae ANTES de publicar nada. Además, las propias
          # acciones ya avisan de que 20 está retirado.
          node-version: 22
          registry-url: 'https://npm.pkg.github.com'
          scope: '@SoftbotMX'
      - name: Enable Corepack (Yarn)
        run: corepack enable

      - name: Install deps (Yarn)
        run: yarn install --immutable

      # LAS PRUEBAS ANTES DE PUBLICAR, y no en un flujo aparte que se pueda
      # ignorar: lo que sale de aquí lo instalan cuatro proyectos, y una versión
      # rota se descubre en el de al lado.
      - name: Test
        run: yarn test

      - name: Build
        run: yarn build

      - name: Ensure version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          [ "$TAG" = "$PKG_VERSION" ] || (echo "Tag($TAG) != version($PKG_VERSION)"; exit 1)

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
