name: Publish to GitHub Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}
  release:
      types: [published]
jobs:
  publish:
    # Runner de GitHub: publicar no necesita nada de la red de la oficina, y con
    # el self-hosted la publicacion quedaba en cola hasta encender esa maquina.
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://npm.pkg.github.com'
          scope: '@SoftbotMX'
      - name: Enable Corepack (Yarn)
        run: corepack enable

      - name: Install deps (Yarn)
        run: yarn install --immutable

      - name: Build
        run: yarn build

      - name: Ensure version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          [ "$TAG" = "$PKG_VERSION" ] || (echo "Tag($TAG) != version($PKG_VERSION)"; exit 1)

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
